name: HTMLArcade
options:
  bundleIdPrefix: com.htmlarcade
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: WV593VF4XZ
targets:
  HTMLArcade:
    type: application
    platform: iOS
    sources:
      - path: Arcade
        excludes: [Resources]
      - path: Arcade/Resources/Assets.xcassets
        buildPhase: resources
      - path: Arcade/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Arcade/Resources/LocalGames
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warren.htmlarcade
        PRODUCT_NAME: HTMLArcade
        INFOPLIST_FILE: Arcade/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
  ArcadeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ArcadeTests]
    dependencies:
      - target: HTMLArcade
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ArcadeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ArcadeUITests]
    dependencies:
      - target: HTMLArcade
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HTMLArcade:
    build:
      targets:
        HTMLArcade: all
    test:
      targets: [ArcadeTests, ArcadeUITests]
